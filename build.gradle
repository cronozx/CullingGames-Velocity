plugins {
    id 'java'
    id 'eclipse'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.8'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'cronozx'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${velocityVersion}"
    annotationProcessor "com.velocitypowered:velocity-api:${velocityVersion}"
    // Jedis pulls in slf4j-api and gson transitively; Velocity provides both at runtime, so keep
    // them out of the shaded jar rather than shipping a second unrelocated copy.
    implementation("redis.clients:jedis:${jedisVersion}") {
        exclude group: 'org.slf4j'
        exclude group: 'com.google.code.gson'                       // NOT com.google.gson — that is the package, not the group
    }
    implementation "org.apache.commons:commons-pool2:${commonsPool2Version}"
    implementation "org.spongepowered:configurate-yaml:${configurateVersion}"
    // Only used when backend is mysql; shaded so no proxy-provided driver is required.
    implementation("com.mysql:mysql-connector-j:${mysqlVersion}") {
        exclude group: 'com.google.protobuf'   // only needed for X DevAPI, which this plugin never uses
    }
}

def targetJavaVersion = 21
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

def templateSource = file('src/main/templates')
def templateDest = layout.buildDirectory.dir('generated/sources/templates')
def generateTemplates = tasks.register('generateTemplates', Copy) { task ->
    def props = ['version': project.version]
    task.inputs.properties props

    task.from templateSource
    task.into templateDest
    task.expand props
}

sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })

project.idea.project.settings.taskTriggers.afterSync generateTemplates
project.eclipse.synchronizationTasks(generateTemplates)

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()

    // Everything shaded is relocated, so this jar can never be the one that breaks another
    // plugin shading the same library at a different version.
    relocate 'redis.clients.jedis',      'cronozx.cullinggames.libs.jedis'
    relocate 'org.apache.commons.pool2', 'cronozx.cullinggames.libs.pool2'
    relocate 'org.json',                 'cronozx.cullinggames.libs.json'   // jedis transitive; same collision risk
    // Shadow rewrites the driver class name in our source too, so the JDBC URL still resolves.
    relocate 'com.mysql',                'cronozx.cullinggames.libs.mysql'
}

tasks.build.dependsOn tasks.shadowJar
